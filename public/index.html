<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Item Manager</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <aside class="sidebar">
        <div class="brand">
          <img class="brand-mark" src="/image/Icon.png" alt="" draggable="false" />
          <div>
            <h1>Item Manager</h1>
            <p>Local Library</p>
          </div>
        </div>

        <button class="primary" id="newItemButton" title="添加新的收藏条目">+ 新建条目</button>
        <button class="secondary sidebar-action" id="manageTagsButton" title="打开标签管理器">新建/编辑标签</button>

        <label class="search">
          <span>搜索</span>
          <input id="searchInput" type="search" placeholder="名称、作者、标签、备注" title="按名称、作者、标签或备注搜索" />
        </label>

        <section class="tag-panel">
          <div class="label-row">
            <h2>标签</h2>
            <button type="button" class="text-button" id="clearTagFiltersButton" title="清除所有标签筛选">清除</button>
          </div>
          <div class="sidebar-tags" id="sidebarTags"></div>
        </section>

        <div class="stats">
          <span>条目</span>
          <strong><span id="shownCount">0</span>/<span id="totalCount">0</span></strong>
        </div>
      </aside>

      <section class="content">
        <header class="toolbar">
          <div>
            <h2>收藏库</h2>
            <p>链接、路径、封面路径和备注都保存在此项目文件夹中。</p>
          </div>
          <div class="toolbar-controls">
            <div class="select-field">
              <span>栏目大小</span>
              <select id="cardSizeSelect" aria-label="栏目大小" title="调整卡片栏目大小">
                <option value="220px">紧凑</option>
                <option value="280px">标准</option>
                <option value="360px">宽松</option>
              </select>
            </div>
            <div class="select-field">
              <span>封面比例</span>
              <select id="coverRatioSelect" aria-label="封面比例" title="调整封面显示比例">
                <option value="1 / 1">方形 1:1</option>
                <option value="4 / 3">相册 4:3</option>
                <option value="16 / 9">宽屏 16:9</option>
              </select>
            </div>
          </div>
        </header>

        <div class="grid" id="itemsGrid"></div>
        <div class="empty" id="emptyState">
          <h3>还没有条目</h3>
          <p>添加第一个作品、资产、文档或下载项。</p>
        </div>
        <button type="button" class="scroll-top" id="scrollTopButton" aria-label="返回顶部" title="返回顶部">↑</button>
      </section>
    </main>

    <dialog id="itemDialog">
      <form id="itemForm" method="dialog">
        <div class="dialog-head">
          <h2 id="dialogTitle">新建条目</h2>
          <button type="button" class="icon-button" id="closeDialogButton" aria-label="关闭" title="关闭窗口">×</button>
        </div>

        <input type="hidden" id="itemId" />

        <div class="form-grid">
          <label>
            <span>标题</span>
            <input id="titleInput" required placeholder="作品或资源名称" title="输入条目标题" />
          </label>
          <label>
            <span>作者 / 商店</span>
            <input id="creatorInput" placeholder="Creator, Shop, Circle" title="输入作者、商店或来源" />
          </label>
          <label>
            <span>网页链接</span>
            <input id="urlInput" type="url" placeholder="https://..." title="输入可打开的网页链接" />
          </label>
          <div class="field">
            <div class="label-row">
              本地路径
              <span class="inline-actions">
                <button type="button" class="mini-button" id="pickFolderButton" title="从本机选择一个文件夹">选择文件夹</button>
                <button type="button" class="mini-button" id="pickFileButton" title="从本机选择一个文件">选择文件</button>
              </span>
            </div>
            <input id="pathInput" placeholder="F:\Downloads\item.zip 或文件夹路径" title="输入或选择本地文件/文件夹路径" />
          </div>
          <div class="field wide">
            <span>标签</span>
            <div class="tag-picker" id="tagPicker"></div>
          </div>
        </div>

        <fieldset class="cover-field">
          <legend>封面</legend>
          <div class="segmented">
            <label title="使用远程图片链接作为封面"><input type="radio" name="coverMode" value="url" checked /> 加载网页链接</label>
            <label title="使用本机图片路径作为封面"><input type="radio" name="coverMode" value="local" /> 使用本地图片</label>
          </div>
          <label id="coverUrlGroup">
            <span>封面 URL</span>
            <input id="coverUrlInput" type="url" placeholder="https://.../cover.jpg" title="输入封面图片 URL" />
          </label>
          <div class="field" id="coverPathGroup" hidden>
            <div class="label-row">
              本地图片路径
              <span class="inline-actions">
                <button type="button" class="mini-button" id="pickCoverImageButton" title="从本机选择一张封面图片">选择图片</button>
              </span>
            </div>
            <input id="coverPathInput" placeholder="F:\Pictures\cover.png" title="仅保存本地封面图片路径" />
          </div>
        </fieldset>

        <label>
          <span>备注</span>
          <textarea id="notesInput" rows="4" placeholder="版本、购买状态、安装说明等" title="填写条目备注"></textarea>
        </label>

        <div class="dialog-actions">
          <button type="button" class="danger" id="deleteButton" title="删除当前条目">删除</button>
          <div>
            <button type="button" class="secondary" id="cancelButton" title="放弃更改并关闭">取消</button>
            <button class="primary" id="saveButton" title="保存条目">保存</button>
          </div>
        </div>
      </form>
    </dialog>

    <dialog id="tagDialog">
      <form id="tagForm" method="dialog">
        <div class="dialog-head">
          <h2>新建/编辑标签</h2>
          <button type="button" class="icon-button" id="closeTagDialogButton" aria-label="关闭" title="关闭窗口">×</button>
        </div>

        <div class="tag-manager">
          <aside class="tag-manager-side">
            <div class="tag-manager-list" id="tagManagerList"></div>
            <button type="button" class="secondary" id="newTagButton" title="创建一个新标签">新建标签</button>
          </aside>
          <section class="tag-editor">
            <input type="hidden" id="tagIdInput" />
            <label>
              <span>标签名称</span>
              <input id="tagNameInput" placeholder="avatar" title="输入标签名称" />
            </label>
            <div class="color-grid">
              <label>
                <span>背景颜色</span>
                <span class="color-control">
                  <button type="button" class="color-swatch-button" data-color-target="tagBgInput" title="打开背景颜色调色盘"></button>
                  <input type="hidden" id="tagBgInput" value="#202633" />
                  <button type="button" class="mini-button eyedropper-button" data-color-target="tagBgInput" title="从屏幕取背景颜色">取色</button>
                </span>
              </label>
              <label>
                <span>文字颜色</span>
                <span class="color-control">
                  <button type="button" class="color-swatch-button" data-color-target="tagTextInput" title="打开文字颜色调色盘"></button>
                  <input type="hidden" id="tagTextInput" value="#bfd0df" />
                  <button type="button" class="mini-button eyedropper-button" data-color-target="tagTextInput" title="从屏幕取文字颜色">取色</button>
                </span>
              </label>
              <label>
                <span>边框颜色</span>
                <span class="color-control">
                  <button type="button" class="color-swatch-button" data-color-target="tagBorderInput" title="打开边框颜色调色盘"></button>
                  <input type="hidden" id="tagBorderInput" value="#2a3140" />
                  <button type="button" class="mini-button eyedropper-button" data-color-target="tagBorderInput" title="从屏幕取边框颜色">取色</button>
                </span>
              </label>
            </div>
            <div class="tag-preview-row">
              <span>预览</span>
              <span class="tag" id="tagPreview">Tag</span>
            </div>
            <div class="dialog-actions">
              <button type="button" class="danger" id="deleteTagButton" title="删除当前标签">删除</button>
              <div>
                <button type="button" class="secondary" id="resetTagColorsButton" title="恢复默认标签颜色">默认</button>
                <button type="button" class="secondary" id="randomTagColorsButton" title="随机生成标签颜色">随机</button>
                <button class="primary" id="saveTagButton" title="保存标签">保存</button>
              </div>
            </div>
          </section>
        </div>
        <div class="color-popover" id="colorPopover" hidden>
          <div class="color-popover-head">
            <span>调色盘</span>
            <button type="button" class="icon-button" id="closeColorPopoverButton" aria-label="关闭调色盘" title="关闭调色盘">×</button>
          </div>
          <canvas class="color-field" id="colorField" width="260" height="156" aria-label="颜色区域"></canvas>
          <div class="color-popover-controls">
            <span class="color-popover-swatch" id="colorPopoverPreview" title="当前颜色"></span>
            <input id="colorHueRange" class="hue-slider" type="range" min="0" max="360" value="0" title="调整色相" />
          </div>
        </div>
      </form>
    </dialog>

    <dialog id="messageDialog">
      <form method="dialog">
        <div class="dialog-head">
          <h2 id="messageTitle">提示</h2>
          <button type="button" class="icon-button" id="messageCloseButton" aria-label="关闭" title="关闭提示">×</button>
        </div>
        <p class="message-body" id="messageBody"></p>
        <div class="dialog-actions message-actions">
          <span></span>
          <div>
            <button type="button" class="secondary" id="messageCancelButton" title="取消操作">取消</button>
            <button class="primary" id="messageOkButton" title="确认操作">确定</button>
          </div>
        </div>
      </form>
    </dialog>

    <script src="/app.js"></script>
  </body>
</html>
